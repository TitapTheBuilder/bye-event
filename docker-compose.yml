name: exhibition-system

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibition
      POSTGRES_PASSWORD: exhibition
      POSTGRES_DB: exhibition
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibition -d exhibition"]
      interval: 5s
      timeout: 5s
      retries: 10

  exhibitor:
    build:
      context: .
      dockerfile: apps/exhibitor/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      NODE_ENV: production
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
      # Absolute, publicly-reachable origin of the admin app. Needed because
      # event_settings.logo_url (uploaded here) is also read by the
      # exhibitor app, which runs as a separate container/subdomain -- see
      # apps/admin/lib/uploads.ts.
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3001}
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  uploads-data:
