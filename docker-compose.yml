name: exhibition-system

services:
  postgres:
    image: docker.arvancloud.ir/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibition
      POSTGRES_PASSWORD: exhibition
      POSTGRES_DB: exhibition
    ports:
      - "5433:5433"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibition -d exhibition"]
      interval: 5s
      timeout: 5s
      retries: 10

  exhibitor:
    build:
      context: .
      dockerfile: apps/exhibitor/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        BASE_IMAGE: ${BASE_IMAGE:-docker.arvancloud.ir/node:22-alpine}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        BASE_IMAGE: ${BASE_IMAGE:-docker.arvancloud.ir/node:22-alpine}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      NODE_ENV: production
      # Logos uploaded here land on the shared uploads-data volume and are
      # served by BOTH apps from their own /uploads/[...path] route, so
      # event_settings.logo_url stays origin-relative and needs no
      # knowledge of this app's public URL.
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  uploads-data:
