name: exhibition-system-dev

# Local-only container stack. These credentials are intentionally development
# values; never deploy this file to an internet-facing host.
services:
  postgres:
    image: docker.arvancloud.ir/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibition
      POSTGRES_PASSWORD: exhibition
      POSTGRES_DB: exhibition
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibition -d exhibition"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  exhibitor:
    build:
      context: .
      dockerfile: apps/exhibitor/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      EXHIBITOR_SESSION_SECRET: local-exhibitor-development-secret
      EXHIBITOR_PUBLIC_ORIGIN: http://localhost:3000
      NODE_ENV: development
      TRUST_PROXY: "0"
      ALLOW_INSECURE_DATABASE: "1"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://exhibition:exhibition@postgres:5432/exhibition
      ADMIN_SESSION_SECRET: local-admin-development-secret
      ADMIN_PUBLIC_ORIGIN: http://localhost:3001
      NODE_ENV: development
      TRUST_PROXY: "0"
      ALLOW_INSECURE_DATABASE: "1"
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  uploads-data:
